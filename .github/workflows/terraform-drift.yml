name: terraform-drift

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions: {}

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  drift:
    name: drift (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        stack: [network, app]
    concurrency:
      group: tf-drift-${{ matrix.stack }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: infra/prod/${{ matrix.stack }}
    env:
      STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the stack exists
        id: exists
        working-directory: .
        run: |
          if [ -d "infra/prod/$STACK" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.exists.outputs.ok == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials (read-only plan role)
        if: steps.exists.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-drift-${{ matrix.stack }}-${{ github.run_id }}

      - name: terraform init
        if: steps.exists.outputs.ok == 'true'
        run: terraform init -lockfile=readonly -input=false -no-color

      - name: terraform plan (detect drift)
        if: steps.exists.outputs.ok == 'true'
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false -detailed-exitcode > plan.txt 2>&1
          ec=$?
          set -e
          cat plan.txt
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -ne 1 ] # 1 = error -> fail the job; 0 = clean; 2 = drift

      - name: Open, update or close the drift issue
        if: steps.exists.outputs.ok == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          PLAN_FILE: infra/prod/${{ matrix.stack }}/plan.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const title = `Drift detected: ${process.env.STACK}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((i) => !i.pull_request && i.title === title);

            if (process.env.EXIT_CODE === '2') {
              const max = 60000;
              let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
              if (plan.length > max) plan = plan.slice(0, max) + `\n... truncated, see ${process.env.RUN_URL}`;
              const body = [
                `The \`${process.env.STACK}\` stack no longer matches \`main\`.`,
                '',
                'Fix it by reverting the change in AWS, or by updating the code in a PR.',
                '',
                '<details><summary>Show plan</summary>',
                '',
                '```text',
                plan,
                '```',
                '',
                '</details>',
                '',
                `<sub>Last checked: ${new Date().toISOString()} · [workflow run](${process.env.RUN_URL})</sub>`,
              ].join('\n');
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                core.info(`Updated #${existing.number}`);
              } else {
                const { data } = await github.rest.issues.create({ owner, repo, title, body });
                core.info(`Opened #${data.number}`);
              }
            } else if (process.env.EXIT_CODE === '0' && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `No drift any more ([run](${process.env.RUN_URL})). Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed #${existing.number}`);
            }
